# Purpose: Temporary declarative preview client (no kubectl run needed).
# Apply: kubectl apply -f manifests/base/preview-test.yaml
apiVersion: v1
kind: Pod
metadata:
  name: preview-test
  namespace: nb-02230140
  labels:
    app: preview-test
spec:
  restartPolicy: Never # Run a one-shot preview request only.
  containers:
    - name: preview-test
      image: busybox:1.36 # Allowed BusyBox-based client.
      imagePullPolicy: IfNotPresent # Not a restricted notice-board image.
      resources:
        requests:
          cpu: 10m # Fits quota even with both colours active.
          memory: 16Mi # Minimal one-shot request.
        limits:
          cpu: 25m # Limits temporary resource use.
          memory: 32Mi # Limits temporary resource use.
      command: ["/bin/sh", "-c"]
      args: ["wget -qO- http://notice-board-preview/version"] # Verify green directly.
